function initAudio(){try{ac=ac||new (window.AudioContext||window.webkitAudioContext)();if(ac.state=='suspended')ac.resume();if(!fbuf&&!initAudio.l){initAudio.l=1;const b=atob(FLIP.split(',')[1]),u=new Uint8Array(b.length);for(let i=0;i<b.length;i++)u[i]=b.charCodeAt(i);ac.decodeAudioData(u.buffer,x=>fbuf=x,()=>{})}}catch(e){}}
function tone(){if(snd=='off')return;initAudio();if(snd=='real'){if(fbuf)try{const s=ac.createBufferSource(),g=ac.createGain();s.buffer=fbuf;s.playbackRate.value=.95+Math.random()*.12;g.gain.value=.9;s.connect(g).connect(ac.destination);s.start()}catch(e){}}else synth()}

const MOB=()=>matchMedia('(max-width:760px),(max-aspect-ratio:1/1)').matches;

const PH=()=>{try{return MOB()||(matchMedia('(pointer:coarse)').matches&&Math.min(screen.width,screen.height)<=820)}catch(e){return MOB()}};

const PHL=()=>PH()?(innerWidth<innerHeight?'single':'double'):null;
const phCls=()=>document.documentElement.classList.toggle('ph',PH());phCls();addEventListener('resize',phCls);

/* ---------- offline store (own small database, works for plain files too) ---------- */
const odb=new Promise(r=>{try{const o=indexedDB.open('fs_off',1);o.onupgradeneeded=()=>o.result.createObjectStore('k');o.onsuccess=()=>r(o.result);o.onerror=()=>r(null)}catch(e){r(null)}});
const oget=async k=>{const d=await odb;if(!d)return;return new Promise(r=>{try{const q=d.transaction('k').objectStore('k').get(k);q.onsuccess=()=>r(q.result);q.onerror=()=>r()}catch(e){r()}})};
const oset=async(k,v)=>{const d=await odb;if(!d)return false;return new Promise(r=>{try{const t=d.transaction('k','readwrite');t.objectStore('k').put(v,k);t.oncomplete=()=>r(true);t.onerror=t.onabort=()=>r(false)}catch(e){r(false)}})};

/* ---------- dictionary: offline pack first, then words looked up before, then the internet ---------- */
let DICT=null;
const normDict=j=>{const m=new Map(),put=(w,d)=>{if(w&&d)m.set(String(w).toLowerCase().trim(),d)};if(Array.isArray(j))j.forEach(e=>{if(e)put(e.word||e.w||e.term,e.definition||e.meaning||e.def||e.d||e.definitions)});else Object.keys(j).forEach(k=>put(k,j[k]));return m};
const defHTML=v=>{if(typeof v==='string')return '<p>'+E(v.length>1200?v.slice(0,1200)+'...':v)+'</p>';if(Array.isArray(v))return v.slice(0,6).map(x=>'<p>&bull; '+E(typeof x==='string'?x:(x&&(x.definition||x.def||x.meaning))||JSON.stringify(x))+'</p>').join('');if(v&&typeof v==='object')return '<p>'+E(JSON.stringify(v).slice(0,800))+'</p>';return ''};
async function dictLoad(){if(DICT!==null)return DICT;try{const raw=await oget('dict');if(!raw)return DICT=false;const txt=raw.text?await raw.text():String(raw);return DICT=normDict(JSON.parse(txt))}catch(e){return DICT=false}}
async function dictSave(txt,src){const j=JSON.parse(txt),n=Array.isArray(j)?j.length:Object.keys(j).length;if(n<500)throw new Error('too small');if(!(await oset('dict',new Blob([txt],{type:'application/json'}))))throw new Error('storage');await oset('dictmeta',{n,src,date:Date.now()});DICT=null;return n}
async function dictDownload(){const urls=['https://cdn.jsdelivr.net/gh/matthewreagan/WebstersEnglishDictionary@master/dictionary.json','https://raw.githubusercontent.com/matthewreagan/WebstersEnglishDictionary/master/dictionary.json'];
 for(const u of urls){try{const r=await fetch(u);if(!r.ok)continue;return await dictSave(await r.text(),u)}catch(e){}}return 0}

 try{const d=await dictLoad();if(d){const alt=[wl,wl.replace(/(ies)$/,'y'),wl.replace(/(es|s|ed|ly)$/,''),wl.replace(/ing$/,''),wl.replace(/ing$/,'e'),wl.replace(/ed$/,'e')];for(const k of alt){if(k&&d.has(k)){out.innerHTML='<b>'+E(k)+'</b> <small>(বহির্সংযোগহীন অভিধান)</small>'+defHTML(d.get(k));return}}}}catch(e){}

 catch(e){out.textContent=(await dictLoad())?'শব্দটি বহির্সংযোগহীন অভিধানে পাওয়া যায়নি।':'ইন্টারনেট নেই, আর বহির্সংযোগহীন অভিধানও এখনো নেই। অনলাইন থাকা অবস্থায় "বহির্সংযোগহীন অভিধান ডাউনলোড" চাপুন।'}}

<script type="text/plain" id="dashCss">
/* Layout: a bento grid of ten idea cards under one greeting line; dark-first to match the reader (navy ground, amber accent). */
:host{display:block;background:var(--bg);color:var(--fg);font:14px/1.55 var(--f-body);padding:18px max(16px,env(safe-area-inset-right,0px)) 64px max(16px,env(safe-area-inset-left,0px));min-height:100%;box-sizing:border-box;
  --bg:#10131b;--surface:#171b27;--raised:#212739;--line:rgba(255,255,255,.08);--line2:rgba(255,255,255,.16);
  --fg:#eceef5;--mut:#8f96ab;--accent:#f5b942;--on-accent:#1b1305;--accent-text:#f5b942;
  --good:#4cc38a;--warn:#f0a34a;--bad:#ef6a6a;--cell:#232a3b;--shadow:0 10px 30px rgba(0,0,0,.35);
  --shelf:#3a2d1c;--shelf2:#241a0f;
  --f-display:'Noto Serif Bengali',Georgia,serif;
  --f-body:'Noto Sans Bengali',system-ui,'Nirmala UI',sans-serif;
  --f-mono:'IBM Plex Mono',ui-monospace,Menlo,monospace;
  color-scheme:dark}

:host([data-theme="light"]){
  --bg:#f3f1ea;--surface:#ffffff;--raised:#f6f3ea;--line:rgba(29,32,48,.1);--line2:rgba(29,32,48,.2);
  --fg:#1d2030;--mut:#666c82;--accent:#e2a321;--on-accent:#1b1305;--accent-text:#8f5a00;
  --good:#1f8a5b;--warn:#b86a0c;--bad:#c93d3d;--cell:#e8e5db;--shadow:0 8px 24px rgba(29,32,48,.1);
  --shelf:#c9b48e;--shelf2:#a68f66;color-scheme:light}

*{box-sizing:border-box}
.wrap{max-width:1200px;margin:0 auto}@media(min-width:1400px){.wrap{max-width:1500px}}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
h1,h2,h3,p{margin:0}

/* header */
.demo{display:flex;flex-wrap:wrap;gap:8px;align-items:center;font:500 12px var(--f-mono);color:var(--mut);margin-bottom:14px}
.demo b{background:var(--accent);color:var(--on-accent);padding:1px 8px;border-radius:999px;font-weight:600}
.top{display:flex;flex-wrap:wrap;gap:12px;align-items:center;justify-content:space-between}
.brand{display:flex;align-items:center;gap:10px;font:700 26px/1 var(--f-display)}
.brand svg{width:30px;height:30px;color:var(--accent)}
.tools{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.find{display:flex;gap:10px;align-items:center;min-width:0;flex:1 1 230px;max-width:360px;padding:8px 12px;border:1px solid var(--line2);border-radius:10px;background:var(--surface);color:var(--mut);text-align:left}
.find span{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
kbd{font:500 11px var(--f-mono);border:1px solid var(--line2);border-bottom-width:2px;border-radius:5px;padding:0 6px;color:var(--mut)}
.btn{padding:8px 13px;border:1px solid var(--line2);border-radius:10px;background:var(--surface);display:inline-flex;gap:7px;align-items:center}
.btn:hover{background:var(--raised)}
.btn.pri{background:var(--accent);color:var(--on-accent);border-color:transparent;font-weight:600}
.btn.pri:hover{filter:brightness(1.07)}
.btn.sq{padding:8px;width:38px;justify-content:center}
.btn svg{width:17px;height:17px}
.seg{display:inline-flex;border:1px solid var(--line2);border-radius:999px;padding:2px;background:var(--surface)}
.seg button{border:0;background:none;padding:5px 11px;border-radius:999px;color:var(--mut);font-weight:500}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--on-accent);font-weight:600}

.hello{display:grid;gap:5px;margin:24px 0 18px}
.date{font:500 12px var(--f-mono);color:var(--mut);letter-spacing:.07em;text-transform:uppercase}
h1{font:700 clamp(22px,4.2vw,34px)/1.3 var(--f-display);text-wrap:balance}
h1 em{font-style:normal;color:var(--accent-text)}

/* bento */
.bento{display:grid;grid-template-columns:repeat(12,minmax(0,1fr));gap:14px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:18px;min-width:0}
.s4{grid-column:span 4}.s5{grid-column:span 5}.s6{grid-column:span 6}.s7{grid-column:span 7}.s8{grid-column:span 8}.s12{grid-column:1/-1}
@media (max-width:960px){.bento>*{grid-column:1/-1}}
.ch{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;margin-bottom:14px;flex-wrap:wrap}
.ct{font:600 11px var(--f-mono);color:var(--mut);letter-spacing:.08em;text-transform:uppercase}
h2{font:700 17px/1.3 var(--f-display);margin-top:3px}
.mut{color:var(--mut)}
.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}

/* covers */
.cover{aspect-ratio:3/4;border-radius:3px 9px 9px 3px;background:linear-gradient(135deg,var(--c1),var(--c2));
  box-shadow:inset 6px 0 0 rgba(0,0,0,.3),inset 7px 0 0 rgba(255,255,255,.07),0 10px 22px rgba(0,0,0,.32);
  padding:13% 10% 9% 17%;display:flex;flex-direction:column;justify-content:space-between;color:#f4ead0;position:relative;overflow:hidden;max-width:100%}
.cover b{font:700 clamp(13px,1.3vw,16px)/1.3 var(--f-display);overflow-wrap:anywhere}
.cover small{opacity:.78;font-size:10.5px;line-height:1.35}
.orn{display:block;width:34%;height:2px;border-radius:2px;background:#f4ead0b0;margin-bottom:9px}
.pb{height:5px;border-radius:3px;background:var(--cell);overflow:hidden}
.pb i{display:block;height:100%;background:var(--accent);border-radius:3px}
.pb.done i{background:var(--good)}

/* idea 1: continue reading */
.cont{display:grid;grid-template-columns:150px minmax(0,1fr);gap:22px;align-items:center}
.cont .cover{transform:perspective(700px) rotateY(-13deg);transition:transform .35s;transform-origin:left center;margin-left:6px}
.cont:hover .cover{transform:perspective(700px) rotateY(-4deg)}
.cinfo{display:grid;gap:12px;min-width:0}
.kick{font:600 11px var(--f-mono);color:var(--accent-text);letter-spacing:.08em;text-transform:uppercase}
.cinfo h3{font:700 clamp(21px,3vw,28px)/1.25 var(--f-display)}
.pg{display:flex;justify-content:space-between;gap:10px;font-size:13px;margin-bottom:6px}
.minis{display:flex;flex-wrap:wrap;gap:8px 22px}
.minis div{display:grid;gap:1px}
.minis small{color:var(--mut);font-size:11.5px}
.minis b{font:600 15px var(--f-mono)}
.row{display:flex;flex-wrap:wrap;gap:8px}
@media (max-width:520px){.cont{grid-template-columns:1fr}.cont .cover{width:140px}}

/* idea 2: daily goal */
.goal{display:grid;grid-template-columns:132px minmax(0,1fr);gap:16px;align-items:center}
.ring{position:relative;width:132px;height:132px}
.ring svg{width:100%;height:100%;transform:rotate(-90deg)}
.ring circle{fill:none;stroke-width:11}
.ring .tr{stroke:var(--cell)}
.ring .pr{stroke:var(--accent);stroke-linecap:round;transition:stroke-dashoffset .5s,stroke .3s}
.ring.ok .pr{stroke:var(--good)}
.ring div{position:absolute;inset:0;display:grid;place-content:center;text-align:center}
.ring b{font:600 30px/1 var(--f-mono)}
.ring small{color:var(--mut);font-size:11px}
.streak{display:grid;gap:3px}
.streak b{font:700 30px/1.1 var(--f-display)}
.streak small{color:var(--mut)}
.dots{display:flex;gap:7px;margin-top:8px}
.dot{display:grid;gap:4px;justify-items:center;font-size:10.5px;color:var(--mut)}
.dot i{width:16px;height:16px;border-radius:50%;background:var(--cell);border:2px solid transparent}
.dot.ok i{background:var(--good)}
.dot.now i{border-color:var(--accent)}
.slide{margin-top:16px;display:grid;gap:6px}
.slide label{display:flex;justify-content:space-between;color:var(--mut);font-size:12.5px}
input[type=range]{width:100%;accent-color:var(--accent)}
@media (max-width:420px){.goal{grid-template-columns:1fr;justify-items:start}}

/* idea 3: heatmap */
.hm{display:grid;gap:5px}
.mon,.cells{display:grid;grid-template-columns:repeat(26,minmax(0,1fr));gap:3px}
.mon span{font:500 9.5px var(--f-mono);color:var(--mut);white-space:nowrap;overflow:visible}
.cells{grid-template-rows:repeat(7,auto);grid-auto-flow:column}
.cells i{aspect-ratio:1;border-radius:3px;background:var(--cell);display:block}
.cells i.l1{background:color-mix(in srgb,var(--accent) 28%,var(--cell))}
.cells i.l2{background:color-mix(in srgb,var(--accent) 52%,var(--cell))}
.cells i.l3{background:color-mix(in srgb,var(--accent) 78%,var(--cell))}
.cells i.l4{background:var(--accent)}
.cells i.nx{visibility:hidden}
.cells i:hover{outline:1.5px solid var(--fg)}
.legend{display:flex;align-items:center;gap:5px;font-size:11px;color:var(--mut);justify-content:flex-end;margin-top:8px}
.legend i{width:11px;height:11px;border-radius:3px;display:block}
.sumrow{display:flex;flex-wrap:wrap;gap:6px 22px;margin-top:12px;font-size:12.5px;color:var(--mut)}
.sumrow b{color:var(--fg);font-family:var(--f-mono);font-weight:600}
#tip{position:fixed;z-index:60;pointer-events:none;background:var(--fg);color:var(--bg);font:500 12px var(--f-body);padding:4px 9px;border-radius:7px;white-space:nowrap}

/* idea 4: clock */
.clock{display:grid;place-items:center}
.clock svg{width:100%;max-width:230px;height:auto}
.clock text{fill:var(--mut);font:500 9px var(--f-mono)}
.clock .big{fill:var(--fg);font:700 15px var(--f-display)}
.clock .sm{fill:var(--mut);font:400 8px var(--f-body)}

/* idea 5: shelf */
.shbar{display:flex;flex-wrap:wrap;gap:10px;justify-content:space-between;align-items:center;margin-bottom:14px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{border:1px solid var(--line2);background:none;border-radius:999px;padding:4px 12px;font-size:12.5px;color:var(--mut)}
.chip b{font-family:var(--f-mono);font-weight:600;margin-left:5px}
.chip[aria-pressed="true"]{background:var(--fg);color:var(--bg);border-color:transparent}
.covers{display:grid;grid-template-columns:repeat(auto-fill,minmax(128px,1fr));gap:18px 16px}
.bk{display:grid;gap:8px;text-align:left;background:none;border:0;padding:0;align-content:start}
.bk:hover .cover{transform:translateY(-4px)}
.bk .cover{transition:transform .2s}
.bk .meta{display:flex;justify-content:space-between;gap:6px;font-size:11.5px;color:var(--mut)}
.srow{display:flex;align-items:flex-end;gap:4px;padding:16px 16px 0;overflow-x:auto;min-height:268px}
.spine{flex:none;position:relative;border:0;border-radius:2px 2px 0 0;padding:10px 0;width:var(--w);height:var(--h);
  background:linear-gradient(90deg,var(--c2),var(--c1) 42%,var(--c2));color:#f4ead0;overflow:hidden;
  display:flex;justify-content:center;transition:transform .2s;box-shadow:inset 0 0 0 1px rgba(255,255,255,.06)}
.spine:hover,.spine:focus-visible{transform:translateY(-12px)}
.spine span{writing-mode:vertical-rl;font:600 12.5px var(--f-display);max-height:100%;overflow:hidden;white-space:nowrap;text-overflow:ellipsis;position:relative;z-index:1}
.spine::after{content:"";position:absolute;left:0;right:0;bottom:0;height:calc(var(--p) * 1%);background:rgba(255,255,255,.15);border-top:1px solid rgba(255,255,255,.45)}
.spine.fin::before{content:"";position:absolute;top:0;left:0;right:0;height:5px;background:var(--accent);z-index:2}
.board{height:14px;border-radius:0 0 7px 7px;background:linear-gradient(var(--shelf),var(--shelf2));box-shadow:0 8px 14px rgba(0,0,0,.22)}
.spcap{margin-top:14px;font-size:12.5px;color:var(--mut);min-height:20px}
.spcap b{color:var(--fg)}

/* idea 6: pace */
.pace{display:grid;gap:2px}
.pr{display:grid;grid-template-columns:minmax(0,1.2fr) 104px minmax(0,.9fr);gap:12px;align-items:center;padding:10px 0;border-top:1px solid var(--line)}
.pr:first-child{border-top:0}
.pr .n{min-width:0}
.pr .n b{display:block;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pr .n small,.pr .e small{color:var(--mut);font-size:11.5px}
.pr .e{text-align:right;display:grid}
.pr .e b{font:600 13px var(--f-mono)}
.spark{width:104px;height:30px;color:var(--accent)}
@media (max-width:480px){.pr{grid-template-columns:minmax(0,1fr) auto}.pr .spark{display:none}}

/* idea 7: highlights */
.trio{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:14px}
.trio div{background:var(--raised);border-radius:10px;padding:10px 12px;display:grid}
.trio b{font:700 22px/1.2 var(--f-mono)}
.trio small{color:var(--mut);font-size:11.5px}
.mix{display:flex;height:9px;border-radius:5px;overflow:hidden;gap:2px;margin:4px 0 8px}
.mix i{display:block;height:100%}
.key{display:flex;flex-wrap:wrap;gap:4px 14px;font-size:11.5px;color:var(--mut);margin-bottom:12px}
.key span{display:inline-flex;align-items:center;gap:5px}
.key i{width:9px;height:9px;border-radius:50%;display:block}
.note{padding:10px 0;border-top:1px solid var(--line);display:grid;gap:3px}
.note p{line-height:1.7}
.mk{background:linear-gradient(transparent 52%,color-mix(in srgb,var(--mc) 62%,transparent) 52%);padding:0 2px}
.note small{color:var(--mut);font-size:11.5px}

/* idea 8: year goal */
.slots{display:grid;grid-template-columns:repeat(12,minmax(0,1fr));gap:6px;margin:6px 0 14px}
.slots i{aspect-ratio:3/4;border-radius:2px 4px 4px 2px;background:var(--cell);display:block}
.slots i.f{background:var(--accent)}
.big{font:700 34px/1.1 var(--f-display)}
.big small{font:500 15px var(--f-body);color:var(--mut)}
.facts{display:grid;gap:4px;margin-top:6px;color:var(--mut);font-size:12.5px}
.facts b{color:var(--fg);font-family:var(--f-mono);font-weight:600}

.hl{display:grid;gap:16px}
.meter{display:grid;gap:6px}
.meter .l{display:flex;justify-content:space-between;gap:10px;font-size:12.5px;color:var(--mut)}
.meter .l b{color:var(--fg);font-family:var(--f-mono);font-weight:600}
.stack{display:flex;height:12px;border-radius:6px;overflow:hidden;gap:2px}
.stack i{display:block;height:100%}
.alert{display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between;border:1px solid var(--warn);border-radius:10px;padding:10px 12px;font-size:13px}
.alert svg{width:16px;height:16px;color:var(--warn);flex:none}
.alert span{display:flex;gap:8px;align-items:center;min-width:0}

.pal ul{list-style:none;margin:0;padding:6px;max-height:48vh;overflow:auto}
.pal li{display:flex;justify-content:space-between;gap:10px;padding:9px 11px;border-radius:8px;cursor:pointer}
.pal li small{color:var(--mut);font-family:var(--f-mono);font-size:11px}
.pal li[aria-selected="true"]{background:var(--raised);box-shadow:inset 3px 0 0 var(--accent)}
.pal .hint{padding:8px 14px;border-top:1px solid var(--line);font-size:11.5px;color:var(--mut);display:flex;gap:12px}

.calhead h3{font:700 22px/1.2 var(--f-display)}
.calhead small{display:block;color:var(--mut);font-size:12px}
.cnav{display:flex;gap:6px}
.cnav .btn{padding:6px 12px}
.cal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px}
.wh{font:500 10.5px var(--f-mono);color:var(--mut);text-align:center;padding-bottom:4px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.cal>.em{aspect-ratio:1/1.05}
.cd{position:relative;aspect-ratio:1/1.05;min-width:0;border-radius:9px;background:var(--raised);padding:5px 6px;display:flex;flex-direction:column;justify-content:space-between;overflow:hidden}
.cd b{font:700 clamp(14px,1.8vw,19px)/1 var(--f-display)}
.cd small{font:500 9.5px var(--f-mono);color:var(--mut);white-space:nowrap}
.cd.td{outline:2px solid var(--accent);background:color-mix(in srgb,var(--accent) 16%,var(--raised))}
.cd.fe::after{content:"";position:absolute;top:6px;right:6px;width:7px;height:7px;border-radius:50%;background:var(--bad)}
.cd u{position:absolute;left:0;right:0;bottom:0;height:4px}
.cd u.l1{background:color-mix(in srgb,var(--accent) 28%,var(--cell))}
.cd u.l2{background:color-mix(in srgb,var(--accent) 52%,var(--cell))}
.cd u.l3{background:color-mix(in srgb,var(--accent) 78%,var(--cell))}
.cd u.l4{background:var(--accent)}
.calfoot{display:flex;flex-wrap:wrap;gap:8px 16px;align-items:center;justify-content:space-between;margin-top:12px;font-size:12px;color:var(--mut)}
.step{display:inline-flex;align-items:center;gap:6px}

}

/* command palette */
let sel=0,items=[];
function palItems(q){
  q=q.trim().toLowerCase();
  const acts=[{l:t('aUp'),k:'add',s:'⌘'},{l:t('aBk'),k:'backup',s:'⌘'},{l:t('aTheme'),k:'theme',s:'⌘'},{l:t('aLang'),k:'lang:'+(bn()?'en':'bn'),s:'⌘'}];

  return acts.concat(bk).filter(x=>!q||x.l.toLowerCase().includes(q))}
function palRender(){items=palItems($('#pq').value);sel=Math.min(sel,Math.max(0,items.length-1));
  $('#pl').innerHTML=items.length?items.map((x,i)=>`<li role="option" data-i="${i}" aria-selected="${i===sel}"><span>${esc(x.l)}</span><small>${x.s}</small></li>`).join(''):`<li aria-disabled="true"><span class="mut">${t('none')}</span></li>`;
  const s=$('#pl [aria-selected="true"]');if(s)s.scrollIntoView({block:'nearest'})}
function openPal(){$('#pal').hidden=false;$('#pq').value='';sel=0;palRender();$('#pq').focus()}
function closePal(){$('#pal').hidden=true}
function pick(i){const x=items[i];if(!x)return;closePal();act(x.k)}
$('#pl').addEventListener('click',e=>{const li=e.target.closest('li[data-i]');if(li)pick(+li.dataset.i)});

{const _d=window.draw;if(typeof _d==='function')window.draw=function(){const r=_d.apply(this,arguments);refresh(true);return r}}

<script id="mobile-layer-js">
/* ===== Mobile / Android layer: back button, keep-awake, native downloads, install ===== */
(function(){
'use strict';
var rd=document.getElementById('rd');if(!rd)return;
var cap=window.Capacitor,native=!!(cap&&cap.isNativePlatform&&cap.isNativePlatform());

/* 1. Android back button / back gesture closes things in order: menus -> side panel -> ink bar -> book -> app */
var pushed=false,skip=false;
function isOn(){return rd.classList.contains('on')}
function click(id){var e=document.getElementById(id);if(e)e.click()}
new MutationObserver(function(){
  var on=isOn();
  if(on&&!pushed){try{history.pushState({gd:1},'')}catch(e){}pushed=true;keepAwake(true)}
  else if(!on&&pushed){pushed=false;skip=true;try{history.back()}catch(e){skip=false}}
  if(!on)keepAwake(false);
}).observe(rd,{attributes:true,attributeFilter:['class']});
addEventListener('popstate',function(){
  if(skip){skip=false;return}
  if(!pushed||!isOn())return;
  var side=document.getElementById('side'),ink=document.getElementById('inkbar');
  var layer=null;
  if(rd.classList.contains('open'))layer=function(){rd.classList.remove('open')};
  else if(side&&side.classList.contains('on'))layer=function(){side.classList.remove('on')};
  else if(ink&&ink.classList.contains('on'))layer=function(){click('inkb')};
  if(layer){try{history.pushState({gd:1},'')}catch(e){}layer();return}
  pushed=false;click('bk');
});

/* 2. keep the screen on while a book is open */
var lock=null;
function keepAwake(on){
  if(!('wakeLock' in navigator))return;
  if(on){if(lock)return;navigator.wakeLock.request('screen').then(function(l){lock=l;l.addEventListener('release',function(){if(lock===l)lock=null})}).catch(function(){})}
  else if(lock){var l=lock;lock=null;try{l.release()}catch(e){}}
}
document.addEventListener('visibilitychange',function(){if(!document.hidden&&isOn()&&!lock)keepAwake(true)});

/* 3. no long-press menu on the book pages */
var stg=document.getElementById('stage');
if(stg)stg.addEventListener('contextmenu',function(e){e.preventDefault()});

/* 4. bigger tap targets inside the dashboard (it lives in a shadow root) */
try{
  var h=document.getElementById('dashHost');
  if(h&&h.shadowRoot&&window.CSSStyleSheet&&'adoptedStyleSheets' in h.shadowRoot){
    var sh=new CSSStyleSheet();
    sh.replaceSync('@media(pointer:coarse){.btn,.seg button,.chip,.atabs button{min-height:44px}.btn.sq{width:44px}input,select,textarea{font-size:16px}}');
    h.shadowRoot.adoptedStyleSheets=h.shadowRoot.adoptedStyleSheets.concat([sh]);
  }
}catch(e){}

/* 5. Android WebView cannot save blob: downloads. Inside the native app, send them to the share sheet instead
      (needs @capacitor/filesystem and @capacitor/share - see README). In a normal browser nothing changes. */
function nativeSave(a){
  if(!native||!a||!a.hasAttribute('download'))return false;
  var href=a.href||'';if(!/^(blob:|data:)/.test(href))return false;
  var P=cap.Plugins||{},FS=P.Filesystem,SH=P.Share;if(!FS||!SH)return false;
  var name=(a.getAttribute('download')||'file').replace(/[\\\/:*?"<>|]+/g,'_');
  fetch(href).then(function(r){return r.blob()}).then(function(b){
    return new Promise(function(res,rej){var fr=new FileReader();fr.onload=function(){res(String(fr.result).split(',')[1]||'')};fr.onerror=rej;fr.readAsDataURL(b)});
  }).then(function(b64){
    return FS.writeFile({path:name,data:b64,directory:'CACHE'}).then(function(){return FS.getUri({path:name,directory:'CACHE'})});
  }).then(function(u){return SH.share({title:name,url:u.uri,dialogTitle:name})}).catch(function(err){console.warn('save failed',err)});
  return true;
}
var _click=HTMLAnchorElement.prototype.click;
HTMLAnchorElement.prototype.click=function(){if(nativeSave(this))return;return _click.apply(this,arguments)};
document.addEventListener('click',function(e){var a=e.target.closest&&e.target.closest('a[download]');if(a&&nativeSave(a)){e.preventDefault();e.stopPropagation()}},true);

/* 6. installable web app (not needed inside the Capacitor APK, where files are local) */
if(!native&&'serviceWorker' in navigator&&/^https?:$/.test(location.protocol)){
  addEventListener('load',function(){navigator.serviceWorker.register('sw.js').catch(function(){})});
}
})();
</script>
